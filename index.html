<!doctype html> <!-- Important: must specify -->
<html>

<head>
  <meta charset="utf-8"> <!-- Important: rapi-doc uses utf8 characters -->
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <script type="module" src="rapidoc-min.js"></script>
  <!-- RapiDoc 10.1.0 local, com patch: o destacador não remove mais os marcadores de comentário do Lit (evita travamento com ⌛ / erro "setting 'data'"); reaplicar ao atualizar -->
</head>

<body>
  <rapi-doc id="thedoc" spec-url="api-applix.yaml" show-method-in-nav-bar="as-colored-block" use-path-in-nav-bar="true"
    show-header="false" bg-color="" text-color="" nav-bg-color="#3e4b54" nav-text-color="" nav-hover-bg-color=""
    nav-hover-text-color="" nav-accent-color="#fd6964" primary-color="#00102b" theme="light">
    <img slot="nav-logo"
      src="applix-logo-degrade-horizontal-color.png" />
  </rapi-doc>
  <script>
    // Aplica automaticamente o token retornado por /oauth/cnu/token no bearerAuth.
    const doc = document.getElementById('thedoc');
    doc.addEventListener('after-try', (e) => {
      const { request, responseBody, responseStatus } = e.detail;
      if (!responseStatus || !request.url.includes('/oauth/cnu/token')) return;
      const token = responseBody && responseBody.access_token;
      if (typeof token === 'string' && token) doc.setApiKey('bearerAuth', token);
    });
  </script>
</body>

</html>
